name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break caused by a dependency or a PHP point release surfaces
  # on a quiet Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.5 is the floor and it is not negotiable: RqlParser uses the pipe
        # operator. Add newer versions here as they ship — never an older one
        # without first removing that syntax.
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # No extensions beyond core: this package has zero runtime
          # dependencies and must keep proving it.
          extensions: none, json, mbstring, tokenizer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # No composer.lock is committed (this is a library), so this always
      # resolves fresh — which is the point: it catches a dependency that
      # drifts out from under the declared constraints.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  zero-dependency:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # The README's headline promise. Asserted rather than trusted: install
      # WITHOUT dev dependencies and fail if anything but the package itself
      # ends up in vendor/.
      - name: Install runtime dependencies only
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      # ⚠️ Plain text, not `--format=json`. The JSON form needs an "installed"
      # key, and reading a key that a future composer might rename would count
      # zero and pass for the wrong reason. With nothing installed `composer
      # show` prints NOTHING to stdout (its notices go to stderr), so emptiness
      # here means emptiness. The step also inherits `bash -e`, so a composer
      # that fails outright fails the job rather than reporting an empty list.
      - name: Assert nothing was installed
        run: |
          installed=$(composer show --no-dev 2>/dev/null)
          if [ -n "$installed" ]; then
            echo "::error::coolms/rql claims zero runtime dependencies, but these were installed:"
            echo "$installed"
            exit 1
          fi
          echo "confirmed: zero runtime dependencies"
