name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.5 is the floor: RqlParser uses the pipe operator. Add newer
        # versions as they ship; don't add an older one without dropping that
        # syntax first.
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Everything up to xmlwriter is PHPUnit's, from its composer.json
          # plus what its bootstrap checks at runtime -- ctype and tokenizer
          # are runtime-only, so a list built from `require` alone installs
          # fine and then refuses to run. curl and phar are Composer's.
          #
          # Kept narrow so a future dependency on an exotic extension fails
          # here. It is not what proves the zero-dependency claim; the job
          # below does that.
          extensions: none, ctype, dom, filter, json, libxml, mbstring, tokenizer, xml, xmlwriter, curl, phar

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # No composer.lock here (it's a library), so this resolves fresh every
      # run and catches a dependency drifting out from under the constraints.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit --testdox

  zero-dependency:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # Install without dev dependencies and fail if anything lands in
      # vendor/. The README promises this, so assert it rather than trust it.
      - name: Install runtime dependencies only
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      # Plain text, not --format=json: the JSON form needs an "installed" key,
      # and if composer ever renames it we'd count zero and pass for the wrong
      # reason. With nothing installed `composer show` prints nothing to
      # stdout (notices go to stderr), so empty here really means empty.
      - name: Assert nothing was installed
        run: |
          installed=$(composer show --no-dev 2>/dev/null)
          if [ -n "$installed" ]; then
            echo "::error::coolms/rql claims zero runtime dependencies, but these were installed:"
            echo "$installed"
            exit 1
          fi
          echo "confirmed: zero runtime dependencies"
